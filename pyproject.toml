[project]
name = "atlas"
version = "0.1.0"
description = "Mechanical System Compiler"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
atlas = "atlas.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
