[project]
name = "atlas"
version = "0.1.0"
description = "Mechanical System Compiler"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "black>=26.5.1",
    "rich>=15.0.0",
    "ruff>=0.16.3",
    "typer>=0.27.1",
]

[project.scripts]
atlas = "atlas.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ["py312"]
